spring.application.name=wim100-backend
# render entrega el puerto en la variable PORT, en local se usa 8080
server.port=${PORT:8080}

# conexion a la base de datos
# en la nube (render) se usan las variables DB_URL, DB_USER y DB_PASSWORD con los datos de supabase (postgresql)
# si no existen se usa mysql local (docker), la base se crea sola si no existe
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wim100?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# pocas conexiones para no pasarse del limite del plan gratis de supabase
spring.datasource.hikari.maximum-pool-size=3

# jpa crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
